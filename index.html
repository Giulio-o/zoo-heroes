<!DOCTYPE html><html lang="it"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#113e49"><title>ZOO HEROES — Demo</title><style>
:root{--bg:#102d38;--panel:#174655;--panel2:#1d5662;--mint:#a8f0bf;--gold:#ffd26d;--ink:#eefdfb;--soft:#b9d4d8}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -10%,#32717a,#102e39 65%);color:var(--ink);font-family:system-ui,-apple-system,'Segoe UI',sans-serif;min-height:100vh}button{font:inherit;cursor:pointer;touch-action:manipulation}button:disabled{opacity:.45;cursor:not-allowed}.app{max-width:1100px;margin:auto;padding:14px 14px 106px}.top{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}.logo{font-weight:1000;font-size:clamp(22px,6vw,34px);letter-spacing:-1.4px;color:#eaffb9;text-shadow:0 3px 0 #184a50}.subtitle{font-size:12px;color:var(--soft)}.wallet{display:flex;gap:7px;flex-wrap:wrap}.pill{border:1px solid #487984;border-radius:30px;padding:7px 11px;background:#123b47;font-weight:800;font-size:13px}.hero{margin-top:15px;border:1px solid #5b8d80;background:linear-gradient(125deg,#317c6c,#245c76 72%);border-radius:24px;padding:20px;display:flex;align-items:center;gap:15px;justify-content:space-between;min-height:140px;overflow:hidden}.hero h1{font-size:clamp(22px,5vw,34px);margin:0 0 5px}.hero p{margin:0;color:#e2fff3;max-width:520px}.hero .art{font-size:clamp(55px,14vw,115px);filter:drop-shadow(0 8px 6px #123a4155);animation:bob 3.2s ease-in-out infinite;white-space:nowrap}@keyframes bob{50%{transform:translateY(-9px) rotate(-4deg)}}.tabs{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;position:fixed;bottom:0;left:0;right:0;background:#0d2a35ed;backdrop-filter:blur(14px);border-top:1px solid #416c77;padding:8px max(8px,calc((100vw - 1070px)/2));z-index:20}.tab{background:transparent;border:0;color:#b3cfd3;border-radius:13px;padding:6px 2px;font-size:10px;font-weight:750;min-height:53px}.tab b{display:block;font-size:22px;line-height:28px}.tab.active{background:#286c71;color:white}.layout{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px;margin-top:15px}.panel{border:1px solid #44717c;border-radius:21px;background:linear-gradient(150deg,#205363,#173f4d);padding:16px;box-shadow:0 10px 28px #08212b33}.panel h2,.panel h3{margin:0 0 10px}.muted{color:var(--soft);font-size:13px}.small{font-size:12px}.btn{border:0;border-radius:14px;padding:12px 15px;background:#b8f5b4;color:#174440;font-weight:900;box-shadow:inset 0 -3px #0001;min-height:46px}.btn.secondary{background:#376c79;color:white;border:1px solid #5a929e}.btn.gold{background:#ffdb80;color:#684318}.btn.full{width:100%}.btn-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(138px,1fr));gap:10px}.animal-card{position:relative;text-align:center;background:linear-gradient(145deg,#4ca89d,#215e76);border:3px solid #a5d9c0;border-radius:19px;padding:10px 7px;min-width:0;overflow:hidden;box-shadow:0 5px 0 #0d3441;transition:transform .2s}.animal-card.selected{outline:3px solid var(--gold);transform:translateY(-3px)}.animal-card[data-grade="1"]{border-color:#c9d7e7}.animal-card[data-grade="2"]{border-color:#ffd066}.animal-card[data-grade="3"]{border-color:#80e6de}.animal-card[data-grade="4"]{border-color:#d7a4ff;box-shadow:0 0 17px #ad74ff99}.animal-card .emoji{font-size:61px;line-height:76px;display:block;filter:drop-shadow(0 7px 3px #0c38435e)}.animal-card .grade{font-size:10px;color:#ffe5a4;font-weight:900;text-transform:uppercase}.animal-card strong{display:block;font-size:16px}.animal-card .stats{font-size:12px;margin-top:6px;color:#e6fff8}.animal-card .level{display:inline-block;border-radius:12px;background:#0e485cbb;padding:3px 8px;font-size:11px}.animal-card .count{position:absolute;right:6px;top:6px;background:#ffd77e;border-radius:20px;padding:2px 7px;color:#4a3d1d;font-size:11px;font-weight:900}.bar{height:12px;border-radius:20px;background:#103745;overflow:hidden;margin:7px 0}.fill{height:100%;background:linear-gradient(90deg,#8fe8aa,#f7dc71);border-radius:20px;transition:width .5s}.mission{position:relative;border:1px solid #639893;border-radius:18px;background:linear-gradient(130deg,#366d57,#235566);padding:16px;overflow:hidden}.mission:before{content:'🌿';position:absolute;opacity:.12;right:0;top:-30px;font-size:130px}.mission.ocean{background:linear-gradient(130deg,#236e99,#173c74)}.mission.ice{background:linear-gradient(130deg,#658ea5,#335773)}.mission .symbol{font-size:45px}.mission h3{margin:7px 0}.battle-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.battle-grid .animal-card .emoji{font-size:46px;line-height:55px}.battle-grid .animal-card strong{font-size:13px}.battle-grid .animal-card{padding:7px 3px}.battle-grid .stats{font-size:10px}.log{min-height:42px;background:#0b2c39;padding:11px;border-radius:13px;margin:10px 0;line-height:1.4}.enemy{background:#2c6370;border-radius:17px;padding:15px;text-align:center}.enemy .monster{font-size:60px}.tag{background:#0c3949;padding:5px 9px;border-radius:11px;font-weight:800;font-size:12px;display:inline-block;margin:3px}.quest{border:1px solid #568c97;padding:12px;border-radius:15px;background:#245665;margin-top:12px}.option{width:100%;background:#174454;border:1px solid #54808a;color:white;border-radius:12px;text-align:left;padding:12px;margin:5px 0}.option.correct{background:#276c56;border-color:#84e7b6}.option.wrong{background:#834b51}.overlay{position:fixed;inset:0;background:#031a21c9;display:grid;place-items:center;padding:15px;z-index:40}.modal{width:min(94vw,470px);background:linear-gradient(150deg,#2c7278,#194653);border:2px solid #99d6bb;border-radius:22px;padding:21px;max-height:90vh;overflow:auto;text-align:center}.modal .big{font-size:90px;animation:pop .65s ease}@keyframes pop{from{transform:scale(.3) rotate(-10deg);opacity:.2}to{transform:scale(1);opacity:1}}.section-title{font-size:21px;margin:22px 0 11px}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.notice{border-left:4px solid var(--gold);background:#204d59;padding:12px;border-radius:8px;margin:10px 0}.choice{display:flex;gap:8px;flex-wrap:wrap}.choice .btn{flex:1}.hide{display:none!important}.float{animation:bob 3s ease-in-out infinite}.achievement{color:#fff3bf}.tiny{font-size:11px}.glow{box-shadow:0 0 25px #d8b96688}.onboard{max-width:470px}.onboard label{display:block;margin:14px 0 5px}.onboard input,.onboard select{width:100%;padding:12px;border-radius:12px;border:1px solid #73a9aa;background:#143d4a;color:white;font:inherit}.footer{font-size:11px;color:#a7c9d0;margin-top:20px}.sprinkle{font-size:24px}@media(max-width:500px){.app{padding:10px 10px 96px}.panel{padding:13px}.hero{padding:15px}.hero .art{font-size:57px}.tabs{gap:0}.tab{font-size:9px}.tab b{font-size:20px}.animal-card .emoji{font-size:52px}.battle-grid .animal-card .emoji{font-size:40px}.battle-grid .animal-card .stats{display:none}}
</style></head><body><div id="app" class="app"></div><div id="modal"></div><script>
(()=>{'use strict';const SAVE='zooheroes-demo-v1';const species=[{id:'lion',name:'Leone',emoji:'🦁',hab:'savana',role:'Forza',power:7,speed:5,brain:4,fact:'Le leonesse spesso collaborano durante la caccia.'},{id:'cheetah',name:'Ghepardo',emoji:'🐆',hab:'savana',role:'Velocità',power:4,speed:10,brain:5,fact:'Il ghepardo è velocissimo, ma solo per brevi tratti.'},{id:'elephant',name:'Elefante',emoji:'🐘',hab:'savana',role:'Difesa',power:9,speed:2,brain:8,fact:'Gli elefanti comunicano anche con suoni a bassa frequenza.'},{id:'zebra',name:'Zebra',emoji:'🦓',hab:'savana',role:'Velocità',power:4,speed:8,brain:5,fact:'Ogni zebra possiede un disegno di strisce diverso.'},{id:'monkey',name:'Scimmia',emoji:'🐒',hab:'savana',role:'Astuzia',power:3,speed:7,brain:9,fact:'Molte scimmie vivono in gruppi sociali.'},{id:'dolphin',name:'Delfino',emoji:'🐬',hab:'oceano',role:'Astuzia',power:5,speed:8,brain:9,fact:'I delfini respirano aria con i polmoni.'},{id:'turtle',name:'Tartaruga',emoji:'🐢',hab:'oceano',role:'Difesa',power:3,speed:2,brain:5,fact:'Molte tartarughe marine migrano per grandi distanze.'},{id:'octopus',name:'Polpo',emoji:'🐙',hab:'oceano',role:'Astuzia',power:3,speed:5,brain:10,fact:'I polpi hanno otto braccia e sanno risolvere problemi.'},{id:'shark',name:'Squalo',emoji:'🦈',hab:'oceano',role:'Forza',power:9,speed:8,brain:5,fact:'Gli squali sono pesci e respirano con le branchie.'},{id:'penguin',name:'Pinguino',emoji:'🐧',hab:'ghiacci',role:'Difesa',power:3,speed:4,brain:6,fact:'I pinguini sono uccelli che non volano ma nuotano.'},{id:'polar',name:'Orso polare',emoji:'🐻‍❄️',hab:'ghiacci',role:'Forza',power:10,speed:5,brain:6,fact:'L’orso polare è adattato al freddo artico.'},{id:'seal',name:'Foca',emoji:'🦭',hab:'ghiacci',role:'Velocità',power:5,speed:7,brain:6,fact:'Le foche hanno uno spesso strato di grasso isolante.'}];
const habitats=[{id:'savana',title:'Savana dorata',emoji:'🌅',climate:'Praterie e grandi erbivori',req:0,boss:'🌪️',enemy:'Tempesta di sabbia',missions:[{title:'Il guado del fiume',question:'Quale animale è noto per la velocità negli scatti brevi?',answers:['Ghepardo','Tartaruga','Elefante'],correct:0,stat:'speed'},{title:'Il branco in viaggio',question:'Quale animale vive spesso in un branco con leonesse e cuccioli?',answers:['Polpo','Leone','Squalo'],correct:1,stat:'power'},{title:'La grande tempesta',question:'Quale animale usa la proboscide per bere e afferrare oggetti?',answers:['Zebra','Elefante','Foca'],correct:1,stat:'brain'}]},{id:'oceano',title:'Oceano blu',emoji:'🌊',climate:'Barriere coralline e correnti',req:2,boss:'🌀',enemy:'Corrente vorticosa',missions:[{title:'Rocce sommerse',question:'Come respira un delfino?',answers:['Con le branchie','Con i polmoni','Con la pelle'],correct:1,stat:'brain'},{title:'Mistero dei tentacoli',question:'Quante braccia ha normalmente un polpo?',answers:['Otto','Sei','Dieci'],correct:0,stat:'brain'},{title:'La grande corrente',question:'Quale di questi è un pesce?',answers:['Delfino','Tartaruga','Squalo'],correct:2,stat:'speed'}]},{id:'ghiacci',title:'Regno dei ghiacci',emoji:'❄️',climate:'Freddo, neve e ghiaccio',req:5,boss:'🌨️',enemy:'Bufera di neve',missions:[{title:'La via ghiacciata',question:'Quale uccello nuota ma non vola?',answers:['Pinguino','Foca','Orso polare'],correct:0,stat:'speed'},{title:'La tana al riparo',question:'Quale animale è adattato alla vita nell’Artico?',answers:['Leone','Orso polare','Ghepardo'],correct:1,stat:'power'},{title:'La grande bufera',question:'Cosa aiuta le foche a isolarsi dal freddo?',answers:['Uno strato di grasso','Le piume','Le squame'],correct:0,stat:'brain'}]}];
const defaultState=()=>({name:'Esploratore',age:6,coins:140,gems:0,food:6,packs:2,owned:{lion:{level:1,xp:0,grade:0,duplicates:0,focus:'power'},cheetah:{level:1,xp:0,grade:0,duplicates:0,focus:'speed'},elephant:{level:1,xp:0,grade:0,duplicates:0,focus:'brain'}},team:['lion','cheetah','elephant'],wins:0,stars:0,cleared:[],academy:{track:0,lab:0,shelter:0},seen:{},lastReward:null});let state;try{state=Object.assign(defaultState(),JSON.parse(localStorage.getItem(SAVE)||'{}'));if(!state.owned||!state.team)throw Error('invalid')}catch(e){state=defaultState()}let page='map',activeSpecies='lion',activeHab='savana',battle=null,modal='',questionResult=null;
const $=s=>document.querySelector(s),sp=id=>species.find(a=>a.id===id),owned=id=>state.owned[id],save=()=>{try{localStorage.setItem(SAVE,JSON.stringify(state))}catch(e){}},gradeNames=['Bronzo','Argento','Oro','Platino','Diamante'],gradeCost=[1,2,3,4],focusNames={power:'Forza',speed:'Velocità',brain:'Astuzia'},esc=t=>String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c])),ability=(id,key)=>{const a=sp(id),c=owned(id);return a[key]*5+c.level*2+(c.focus===key?c.level*2:0)+c.grade*3},total=id=>Math.round((ability(id,'power')+ability(id,'speed')+ability(id,'brain'))/3),xpMax=l=>l*30,stars=h=>state.cleared.filter(x=>x.startsWith(h+':')).length;
function grantXP(id,n){const c=owned(id);if(!c)return; c.xp+=n;while(c.level<20&&c.xp>=xpMax(c.level)){c.xp-=xpMax(c.level);c.level++;}if(c.level===20)c.xp=0}function announce(text){modal=`<div class="overlay" onclick="closeModal(event)"><div class="modal"><h2>✨ ${text}</h2><button class="btn full" onclick="closeModal()">Continua</button></div></div>`;render()}
function card(id,click='',extra=''){const a=sp(id),c=owned(id);if(!c)return'';return `<div class="animal-card ${extra}" data-grade="${c.grade}" ${click?`onclick="${click}" role="button" tabindex="0"`:''}><span class="emoji float">${a.emoji}</span><strong>${a.name}</strong><div class="grade">${gradeNames[c.grade]} · ★${c.grade+1}</div><span class="level">Lv ${c.level}</span><div class="stats">⚡ ${ability(id,'speed')} · 💪 ${ability(id,'power')} · 🧠 ${ability(id,'brain')}</div>${c.duplicates?`<div class="count">+${c.duplicates}</div>`:''}</div>`}
function frame(content){return `<header class="top"><div><div class="logo">🐾 ZOO HEROES</div><div class="subtitle">Avventura di carte · Demo educativa</div></div><div class="wallet"><span class="pill">🪙 ${state.coins}</span><span class="pill">🍎 ${state.food}</span><span class="pill">🎁 ${state.packs}</span></div></header><div class="hero"><div><h1>${page==='map'?'Esplora il mondo!':page==='battle'?'Sfida della natura':page==='collection'?'La tua squadra':page==='train'?'Allena i tuoi eroi':page==='packs'?'Scopri nuove carte':'Accademia Zoo'}</h1><p>${page==='map'?'Scegli un habitat, supera le missioni e scopri gli animali.':page==='battle'?'Tre animali, tre abilità: scegli con attenzione!':page==='collection'?'Crea una squadra e personalizza le tue carte.':page==='train'?'Ogni allenamento migliora davvero i tuoi animali.':page==='packs'?'Guadagna pacchetti giocando. Usa i doppioni per le fusioni.':'Costruisci e migliora i luoghi di allenamento.'}</p></div><div class="art">${{map:'🌍🦜',battle:'🐆',collection:'🦁🐬',train:'🏃🐢',packs:'🎁✨',academy:'🏡🌱'}[page]}</div></div>${content}<div class="footer">Prototipo gratuito · Niente acquisti, pubblicità o classifiche online · Salvataggio in questo browser · <button style="background:none;border:0;color:#cbe8eb;text-decoration:underline;font-size:11px" onclick="resetDemo()">Ricomincia da zero</button></div><nav class="tabs">${[['map','🗺️','Mappa'],['battle','⚔️','Sfida'],['collection','🃏','Carte'],['train','🏋️','Allena'],['packs','🎁','Pacchi'],['academy','🏡','Base']].map(x=>`<button class="tab ${page===x[0]?'active':''}" onclick="go('${x[0]}')"><b>${x[1]}</b>${x[2]}</button>`).join('')}</nav>`}
function mapPage(){return `<h2 class="section-title">🌎 Scegli il tuo habitat</h2><div class="layout">${habitats.map(h=>{const unlocked=state.stars>=h.req;return `<div class="mission ${h.id==='oceano'?'ocean':h.id==='ghiacci'?'ice':''}"><div class="symbol">${h.emoji}</div><h3>${h.title}</h3><div class="small">${h.climate}</div><p>${unlocked?`⭐ ${stars(h.id)}/3 missioni completate`:`🔒 Si sblocca con ${h.req} stelle (ne hai ${state.stars})`}</p><button class="btn ${unlocked?'':'secondary'}" ${unlocked?`onclick="chooseHab('${h.id}')"`:'disabled'}>${unlocked?'Esplora →':'Da sbloccare'}</button></div>`}).join('')}</div><div class="panel" style="margin-top:14px"><h2>🧭 ${habitats.find(x=>x.id===activeHab).title}: missioni</h2><div class="layout">${habitats.find(x=>x.id===activeHab).missions.map((m,i)=>`<div class="panel"><div class="tag">${state.cleared.includes(activeHab+':'+i)?'⭐ Completata':'🌱 Da scoprire'}</div><h3>${m.title}</h3><p class="muted">Missione ${i+1} · ${focusNames[m.stat]}</p><button class="btn full" onclick="startBattle('${activeHab}',${i})">${state.cleared.includes(activeHab+':'+i)?'Rigioca':'Inizia la sfida'}</button></div>`).join('')}</div></div><div class="notice">👋 Ciao ${esc(state.name)}! Hai ${state.stars} stelle. Completa 2 missioni per sbloccare l'oceano. In battaglia rispondi al quiz, poi scegli una carta e usa le sue abilità.</div><div class="notice">📚 Impara giocando: ogni missione include una domanda sugli animali. Rispondere correttamente dà un bonus alla tua squadra.</div>`}
function collectionPage(){return `<div class="panel" style="margin-top:15px"><h2>🐾 Squadra attiva (3 carte)</h2><div class="battle-grid">${state.team.map(id=>card(id,`inspect('${id}')`)).join('')}</div><p class="muted">Tocca una carta per vedere dettagli, specializzazione e fusione. Per sostituirla usa “Aggiungi alla squadra”.</p></div><h2 class="section-title">Collezione · ${Object.keys(state.owned).length}/${species.length} animali</h2><div class="card-grid">${species.map(a=>owned(a.id)?card(a.id,`inspect('${a.id}')`):`<div class="animal-card" style="opacity:.55"><span class="emoji">❔</span><strong>Da scoprire</strong><span class="level">${a.hab}</span></div>`).join('')}</div>`}
function inspect(id){activeSpecies=id;const a=sp(id),c=owned(id);modal=`<div class="overlay" onclick="closeModal(event)"><div class="modal"><div style="max-width:185px;margin:auto">${card(id)}</div><h2>${a.name}</h2><p class="muted">${a.fact}</p><p>Specializzazione: <b>${focusNames[c.focus]}</b></p><div class="choice">${['power','speed','brain'].map(k=>`<button class="btn ${c.focus===k?'':'secondary'}" onclick="specialize('${id}','${k}')">${focusNames[k]}</button>`).join('')}</div><p class="small">I gradi non si perdono. Duplicati disponibili: <b>${c.duplicates}</b></p><button class="btn gold full" ${c.grade>=4||c.duplicates<gradeCost[c.grade]?'disabled':''} onclick="fuse('${id}')">✨ ${c.grade>=4?'Grado massimo':`Fondi ${gradeCost[c.grade]} duplicat${gradeCost[c.grade]===1?'o':'i'} → ${gradeNames[c.grade+1]}`}</button><div class="btn-row"><button class="btn secondary" onclick="addTeam('${id}')">➕ Metti in squadra</button><button class="btn secondary" onclick="closeModal()">Chiudi</button></div></div></div>`;render()}
function addTeam(id){if(state.team.includes(id)){announce('È già nella tua squadra!');return}state.team.shift();state.team.push(id);save();inspect(id)}function specialize(id,focus){owned(id).focus=focus;save();inspect(id)}function fuse(id){const c=owned(id),need=gradeCost[c.grade];if(c.grade>=4||c.duplicates<need)return;c.duplicates-=need;c.grade++;save();inspect(id)}
function trainPage(){const c=owned(activeSpecies)?owned(activeSpecies):owned(state.team[0]);if(!c||!owned(activeSpecies))activeSpecies=state.team[0];const a=sp(activeSpecies),d=owned(activeSpecies),remaining=d.level<20?xpMax(d.level)-d.xp:0;return `<div class="panel" style="margin-top:15px"><h2>🎯 Scegli chi allenare</h2><div class="card-grid">${Object.keys(state.owned).map(id=>card(id,`trainSelect('${id}')`,id===activeSpecies?'selected':'')).join('')}</div></div><div class="panel" style="margin-top:14px"><div class="row"><h2>${a.emoji} ${a.name} · Lv ${d.level}/20</h2><span class="tag">${gradeNames[d.grade]}</span></div><div class="bar"><div class="fill" style="width:${d.level===20?100:100*d.xp/xpMax(d.level)}%"></div></div><p class="muted">${d.level===20?'Livello massimo raggiunto':`${d.xp}/${xpMax(d.level)} XP · ${remaining} XP al prossimo livello`}</p><div class="notice">La tua specializzazione è <b>${focusNames[d.focus]}</b>. Allenare questa caratteristica dà un bonus maggiore.</div><div class="layout">${[['power','💪','Forza','Percorso di equilibrio'],['speed','⚡','Velocità','Gara tra ostacoli'],['brain','🧠','Astuzia','Indovinello della natura']].map((x,i)=>`<div class="panel"><h3>${x[1]} ${x[2]}</h3><p class="muted">${x[3]}</p><p>Valore attuale: <b>${ability(activeSpecies,x[0])}</b></p><button class="btn full" ${state.food<1||d.level===20?'disabled':''} onclick="training('${x[0]}')">🍎 1 · +${state.academy[x[0]==='speed'?'track':x[0]==='brain'?'lab':'shelter']?30:20} XP</button></div>`).join('')}</div></div>`}
function training(kind){const c=owned(activeSpecies);if(!c||state.food<1||c.level>=20)return;state.food--;const build=kind==='speed'?'track':kind==='brain'?'lab':'shelter';const gain=20+state.academy[build]*10;grantXP(activeSpecies,gain);save();announce(`${sp(activeSpecies).emoji} Allenamento riuscito! +${gain} XP`)}function trainSelect(id){activeSpecies=id;render()}
function packPage(){return `<div class="layout"><div class="panel" style="text-align:center"><div style="font-size:105px" class="float">🎁</div><h2>Pacchetto Natura</h2><p class="muted">Contiene un animale casuale. Se lo possiedi già, ottieni un duplicato per migliorare il grado.</p><p>Pacchetti disponibili: <b>${state.packs}</b></p><button class="btn gold full" ${state.packs<1?'disabled':''} onclick="openPack()">✨ Apri un pacchetto</button></div><div class="panel"><h2>🏆 Ricompense</h2><p>Completa le missioni per ottenere monete, cibo e pacchetti.</p><p>⭐ Stelle raccolte: <b>${state.stars}</b></p><p>⚔️ Sfide vinte: <b>${state.wins}</b></p><p class="muted">Le carte non possono essere acquistate con denaro reale.</p><button class="btn secondary" onclick="go('map')">Vai alle missioni</button></div></div>`}
function openPack(){if(state.packs<1)return;state.packs--;const a=species[Math.floor(Math.random()*species.length)];let copy=!!owned(a.id);if(copy)owned(a.id).duplicates++;else state.owned[a.id]={level:1,xp:0,grade:0,duplicates:0,focus:a.role==='Forza'||a.role==='Difesa'?'power':a.role==='Velocità'?'speed':'brain'};save();modal=`<div class="overlay" onclick="closeModal(event)"><div class="modal"><div class="sprinkle">✨ 🌟 ✨</div><div class="big">${a.emoji}</div><h1>${a.name}</h1><div class="tag">${copy?'Carta duplicata +1':'NUOVO ANIMALE!'}</div><p>${a.fact}</p><button class="btn gold full" onclick="closeModal()">Fantastico!</button></div></div>`;render()}
function academyPage(){const builds=[['track','🏃','Pista della velocità','Allena più rapidamente la velocità'],['lab','🧠','Laboratorio della mente','Allena più rapidamente l’astuzia'],['shelter','🏡','Rifugio della forza','Allena più rapidamente la forza']];return `<div class="panel" style="margin-top:15px"><h2>🌳 La tua Accademia</h2><p class="muted">Costruisci edifici usando le monete guadagnate nelle avventure.</p><div class="layout">${builds.map(([id,emoji,name,desc])=>{const lvl=state.academy[id],cost=80+lvl*80;return `<div class="panel"><div style="font-size:65px">${emoji}</div><h3>${name}</h3><p class="muted">${desc}</p><p>Livello edificio: <b>${lvl}/3</b></p><p class="small">Bonus allenamento: +${lvl*10} XP</p><button class="btn full" ${state.coins<cost||lvl===3?'disabled':''} onclick="build('${id}')">${lvl===3?'Completato':`🪙 ${cost} · ${lvl?'Migliora':'Costruisci'}`}</button></div>`}).join('')}</div></div>`}function build(id){const lvl=state.academy[id],cost=80+lvl*80;if(lvl>=3||state.coins<cost)return;state.coins-=cost;state.academy[id]++;save();announce('Nuova costruzione completata! 🏡')}
function chooseHab(id){activeHab=id;page='map';render();document.querySelector('.panel:last-child')?.scrollIntoView({behavior:'smooth',block:'nearest'})}
function startBattle(hid,i){const h=habitats.find(x=>x.id===hid);if(!h||state.stars<h.req)return;const m=h.missions[i];battle={hab:hid,index:i,turn:1,progress:0,energy:3,selected:state.team[0],questionDone:false,correct:false,log:'Usa i tuoi tre animali per superare la prova. Rispondi alla domanda per ottenere energia!',won:false};questionResult=null;page='battle';render()}
function battlePage(){if(!battle)return `<div class="panel" style="margin-top:14px"><h2>⚔️ Nessuna sfida attiva</h2><p>Visita la mappa e scegli una missione per cominciare!</p><button class="btn" onclick="go('map')">Apri la mappa</button></div>`;const h=habitats.find(x=>x.id===battle.hab),m=h.missions[battle.index];return `<div class="panel" style="margin-top:15px"><div class="row"><h2>${h.emoji} ${m.title}</h2><span class="tag">Turno ${battle.turn}</span></div><div class="enemy"><div class="monster float">${h.boss}</div><strong>${h.enemy}</strong><div class="muted">Supera la prova con la tua squadra!</div><div class="bar"><div class="fill" style="width:${battle.progress}%"></div></div><b>${battle.progress}/100 progressi</b></div><div class="row" style="margin-top:10px"><span>⚡ Energia: <b>${battle.energy}/3</b></span><span>🎯 Bonus: <b>${battle.correct?'Conoscenza +10':'—'}</b></span></div><h3 class="section-title">Scegli un animale</h3><div class="battle-grid">${state.team.map(id=>card(id,`battleSelect('${id}')`,battle.selected===id?'selected':'')).join('')}</div><div class="log">${battle.log}</div>${!battle.questionDone?`<div class="quest"><h3>🧩 Sfida della conoscenza</h3><p>${m.question}</p>${m.answers.map((v,j)=>`<button class="option" onclick="answerQuestion(${j})">${esc(v)}</button>`).join('')}</div>`:`<div class="notice">${questionResult||'Domanda completata.'}</div>`}<div class="btn-row"><button class="btn" ${battle.won||battle.energy<1||!battle.questionDone?'disabled':''} onclick="useAnimal()">✨ Usa abilità (1 energia)</button><button class="btn secondary" ${battle.won?'disabled':''} onclick="rest()">🍃 Recupera energia</button></div>${battle.won?`<button class="btn gold full" onclick="finishBattle()" style="margin-top:12px">🏆 Riscatta ricompense</button>`:''}</div>`}
function battleSelect(id){if(!battle)return;battle.selected=id;render()}function answerQuestion(i){if(!battle||battle.questionDone)return;const m=habitats.find(x=>x.id===battle.hab).missions[battle.index];battle.questionDone=true;battle.correct=i===m.correct;if(battle.correct){battle.energy=3;questionResult='✅ Esatto! +10 bonus su tutte le abilità di questa prova.'}else{questionResult=`🌱 Si impara anche dagli errori! Risposta corretta: ${m.answers[m.correct]}.`};render()}
function useAnimal(){if(!battle||battle.won||battle.energy<1||!battle.questionDone)return;const m=habitats.find(x=>x.id===battle.hab).missions[battle.index],a=sp(battle.selected),v=ability(battle.selected,m.stat),adv=a.hab===battle.hab?8:0,bonus=battle.correct?10:0;const ageAssist=state.age<=7?10:state.age<=9?5:0;const points=Math.max(12,Math.round(v*.50+adv+bonus+ageAssist));battle.progress=Math.min(100,battle.progress+points);battle.energy--;battle.turn++;battle.log=`${a.emoji} ${a.name}: +${points} progressi! ${adv?'Bonus habitat +8. ':''}${bonus?'Bonus conoscenza +10.':''}${ageAssist?'Aiuto esploratore +'+ageAssist+'.':''}`;if(battle.progress>=100){battle.won=true;battle.log='🎉 Fantastico! La tua squadra ha completato la missione!'}render()}function rest(){if(!battle||battle.won)return;battle.energy=3;battle.turn++;battle.log='🍃 Gli animali si riposano e recuperano tutta l’energia.';render()}
function finishBattle(){if(!battle||!battle.won)return;const key=battle.hab+':'+battle.index,first=!state.cleared.includes(key);if(first){state.cleared.push(key);state.stars++;state.packs++;}state.wins++;state.coins+=first?65:25;state.food+=first?3:1;state.team.forEach(id=>grantXP(id,first?55:20));save();battle=null;page='map';announce(first?'Missione completata! ⭐ +65 monete, +3 mele, +1 pacchetto e +55 XP ai tuoi animali.':'Missione rigiocata! +25 monete, +1 mela e +20 XP ai tuoi animali.')}
function go(p){page=p;modal='';render();scrollTo({top:0,behavior:'smooth'})}function closeModal(e){if(e&&e.target.closest('.modal'))return;modal='';render()}function render(){const pages={map:mapPage,battle:battlePage,collection:collectionPage,train:trainPage,packs:packPage,academy:academyPage};$('#app').innerHTML=frame(pages[page]());$('#modal').innerHTML=modal;}
function welcome(){if(localStorage.getItem(SAVE))return;modal=`<div class="overlay"><div class="modal onboard"><div style="font-size:62px">🐆🦁🐘</div><h1>Benvenuto in ZOO HEROES!</h1><p>Gli animali ti aspettano. Scopri, allena, evolvi e proteggi la natura!</p><label>Nome del piccolo esploratore</label><input id="playerName" maxlength="20" placeholder="Esploratore" value="Esploratore"><label>Età</label><select id="playerAge"><option value="6">6–7 anni</option><option value="8">8–9 anni</option><option value="10">10 anni o più</option></select><p class="muted">Una demo per tutte le età, con spiegazioni semplici. Nessun dato viene inviato a server.</p><button class="btn gold full" onclick="begin()">🌍 Comincia l'avventura</button></div></div>`}function begin(){state.name=($('#playerName')?.value||'Esploratore').trim().slice(0,20);state.age=Number($('#playerAge')?.value)||6;save();modal='';render()}function resetDemo(){if(confirm('Vuoi davvero eliminare il progresso salvato in questo browser?')){localStorage.removeItem(SAVE);location.reload()}}
Object.assign(window,{go,inspect,addTeam,specialize,fuse,trainSelect,training,openPack,build,chooseHab,startBattle,battleSelect,answerQuestion,useAnimal,rest,finishBattle,closeModal,begin,resetDemo});welcome();render();})();
</script></body></html>
